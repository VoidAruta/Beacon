name: Aruta Control Panel CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    name: Python Core, Security & Supervisor Tests (${{ matrix.runner }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-latest", "ubuntu-24.04-arm"]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight runtime dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip-audit -r requirements.txt || true

      - name: Run Aruta Doctor & Generate systemd units
        run: |
          python3 -m aruta systemd
          python3 -m aruta doctor

      - name: Run Backend Unit & Security Suite
        run: |
          python3 -m unittest discover -s tests -v

  frontend-build:
    name: Frontend TypeScript Tests & Bundle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Pure Logic Unit Tests (node:test)
        run: npx tsx --test src/utils/hubLogic.test.ts

      - name: Build Production Static Bundle into hub/static
        run: npm run build

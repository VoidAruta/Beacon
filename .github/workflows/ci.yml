name: Hub Control Panel CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    name: Python Core & Supervisor Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Hub Doctor & Generate systemd unit
        run: |
          python3 -m hub systemd
          python3 -m hub doctor

      - name: Run Backend Unit & Integration Suite
        run: |
          python3 -m unittest discover -s tests -v

  frontend-build:
    name: Frontend TypeScript Tests & Bundle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Pure Logic Unit Tests (node:test)
        run: npx tsx --test src/utils/hubLogic.test.ts

      - name: Build Production Bundle
        run: npm run build

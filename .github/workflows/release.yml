name: Build Static UI & Release Archive

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies & build static UI into hub/static/
        run: |
          npm ci
          npm run build:static

      - name: Package standalone release archive (no Node.js required on Android phone)
        run: |
          mkdir -p dist-release/hub-server
          cp -r hub sdk scripts projects requirements.txt README.md LICENSE SECURITY.md CONTRIBUTING.md CHANGELOG.md .gitignore dist-release/hub-server/
          mkdir -p dist-release/hub-server/data
          cp data/.gitkeep dist-release/hub-server/data/
          tar -czf hub-server-aarch64-release.tar.gz -C dist-release hub-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-server-aarch64-release
          path: hub-server-aarch64-release.tar.gz

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hub-server-aarch64-release.tar.gz
          generate_release_notes: true
